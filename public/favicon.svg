<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Gradient from Dark Forest Green to Lime Green -->
    <linearGradient id="gitAnalyzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004F37" />
      <stop offset="100%" stop-color="#D4F772" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="#091A12" />
  
  <!-- Subtle inner border with the gradient -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#gitAnalyzeGrad)" stroke-width="12" opacity="0.8" />
  
  <!-- Stylized GitHub Mark + Analysis Chart / Grid lines -->
  <!-- GitHub Octocat Silhouette centered -->
  <g transform="translate(128, 110) scale(10)" fill="url(#gitAnalyzeGrad)">
    <path d="M12.83 2C6.85 2 2 6.85 2 12.83c0 4.79 3.1 8.84 7.4 10.28.54.1.74-.23.74-.52 0-.26-.01-.94-.01-1.85-3.01.65-3.65-1.45-3.65-1.45-.49-1.25-1.2-1.58-1.2-1.58-.98-.67.07-.66.07-.66 1.09.08 1.66 1.12 1.66 1.12.97 1.65 2.53 1.18 3.14.9.1-.7.38-1.18.69-1.45-2.4-.27-4.93-1.2-4.93-5.35 0-1.18.42-2.15 1.12-2.91-.11-.27-.49-1.38.11-2.87 0 0 .91-.29 2.98 1.11.86-.24 1.79-.36 2.71-.36.92 0 1.85.12 2.71.36 2.07-1.4 2.98-1.11 2.98-1.11.6 1.49.22 2.6.11 2.87.7.76 1.12 1.73 1.12 2.91 0 4.16-2.54 5.07-4.95 5.34.39.34.74 1.01.74 2.03 0 1.47-.01 2.65-.01 3.01 0 .29.2.63.75.52 4.3-1.44 7.4-5.49 7.4-10.28C23.66 6.85 18.81 2 12.83 2z" />
  </g>
  
  <!-- Stylized magnifying glass/analysis loop at bottom right of the icon -->
  <circle cx="340" cy="340" r="45" fill="none" stroke="#D4F772" stroke-width="16" filter="url(#glow)" />
  <line x1="372" y1="372" x2="415" y2="415" stroke="#D4F772" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />
</svg>